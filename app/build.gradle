plugins {
    id 'com.android.application'
}

android {
    namespace 'app.kanapractice'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kanapractice'
        minSdk 24
        targetSdk 34
        versionCode (project.findProperty('vc') ?: '1').toInteger()
        versionName '1.0'
    }

    // 업데이트 때 기존 앱 위에 덮어 설치되려면 매번 같은 서명 키를 써야 한다.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
