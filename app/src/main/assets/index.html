<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가나 연습</title>
<style>
html,body{margin:0}
/* Layout: one-column phone app. Home = unit list, Unit = char grid, Lesson = full-height question flow with a feedback bar at the bottom. */
:root{
  --bg:#f5f6f8;--surface:#ffffff;--fg:#1a2332;--muted:#647084;--line:#dde2ea;
  --primary:#2b5189;--primary-deep:#1d3a66;--primary-fg:#ffffff;--primary-soft:#e5edf8;
  --ok:#1c7f47;--ok-soft:#dcf2e4;--bad:#b8372f;--bad-soft:#fbe3e0;--accent:#d9632a;
  --font-ui:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-kana:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c;--surface:#18202d;--fg:#e9edf4;--muted:#9ba6b8;--line:#2a3445;
    --primary:#7aa5de;--primary-deep:#4f78b1;--primary-fg:#0c1522;--primary-soft:#1d2a3f;
    --ok:#62d08f;--ok-soft:#14301f;--bad:#ff8f86;--bad-soft:#3b1b19;--accent:#f0905a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c;--surface:#18202d;--fg:#e9edf4;--muted:#9ba6b8;--line:#2a3445;
  --primary:#7aa5de;--primary-deep:#4f78b1;--primary-fg:#0c1522;--primary-soft:#1d2a3f;
  --ok:#62d08f;--ok-soft:#14301f;--bad:#ff8f86;--bad-soft:#3b1b19;--accent:#f0905a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-ui);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.kana{font-family:var(--font-kana)}
.num,.stats,.unit-stat{font-variant-numeric:tabular-nums}

/* home */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:1.5rem;letter-spacing:-.01em}
.stats{display:flex;gap:14px;color:var(--muted);font-size:.9rem;font-weight:500}
.stats b{color:var(--fg)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--primary-soft);border-radius:14px;padding:4px;gap:4px}
.tab{border:0;background:transparent;border-radius:11px;padding:10px;font-weight:700;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.voice{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted)}
.voice span{min-width:0}
.link{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.85rem;font-weight:500;white-space:nowrap}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.unit{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-width:0;
  background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 0 var(--line)}
.unit:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.unit-name{font-size:1.35rem;font-weight:700;color:var(--primary)}
.unit-sub{font-family:var(--font-kana);color:var(--muted);letter-spacing:.12em;overflow-wrap:anywhere}
.unit-stat{font-size:.8rem;color:var(--muted);margin-top:4px}
.unit.done{border-color:var(--primary)}
.unit:disabled{opacity:.55}
.mix{grid-column:1/-1}

/* unit preview */
.row{display:flex;align-items:center;gap:12px}
.icon{display:grid;place-items:center;width:44px;height:44px;border:0;background:transparent;border-radius:12px;color:var(--muted);flex:none}
.icon svg{width:24px;height:24px}
h2{margin:0;font-size:1.3rem}
.hint{margin:0;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;background:var(--surface);
  border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line)}
.cell .g{font-size:2.2rem;line-height:1.2;font-weight:500}
.cell .k{color:var(--muted);font-size:.95rem}
.cell:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* buttons */
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:1rem;width:100%;
  background:var(--primary);color:var(--primary-fg);box-shadow:0 4px 0 var(--primary-deep)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--primary-deep)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line)}
.btn.ghost{background:var(--surface);color:var(--primary);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ok{background:var(--ok);color:var(--surface);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.bad{background:var(--bad);color:var(--surface);box-shadow:0 4px 0 rgba(0,0,0,.25)}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:16px;min-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.l-top{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s ease}
.l-body{flex:1;display:flex;flex-direction:column;gap:20px}
.instr{margin:8px 0 0;font-size:1.15rem;font-weight:700}
.prompt{display:flex;align-items:center;justify-content:center;gap:14px;min-height:150px}
.prompt-glyph{font-size:6rem;line-height:1.1;font-weight:500}
.prompt-hangul{font-size:4.5rem;line-height:1.1;font-weight:700;color:var(--primary)}
.speak{display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);color:var(--primary);
  border-radius:50%;box-shadow:0 4px 0 var(--line);flex:none}
.speak svg{width:55%;height:55%}
.speak.small{width:48px;height:48px}
.speak.big{width:110px;height:110px}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:10px;min-width:0;padding:14px;background:var(--surface);
  border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);text-align:left}
.opt .num{display:grid;place-items:center;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;
  font-size:.8rem;color:var(--muted);flex:none}
.opt .lab,.opt .lab-g{flex:1;text-align:center;font-size:1.8rem;font-weight:700}
.opt .lab-g{font-weight:500;font-size:2.2rem;line-height:1.2}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 4px 0 var(--primary)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}
.l-foot{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:2px solid var(--line)}
.l-foot.ok{background:var(--ok-soft);border-color:var(--ok)}
.l-foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-title{margin:0;font-size:1.15rem;font-weight:700}
.l-foot.ok .fb-title{color:var(--ok)}
.l-foot.bad .fb-title{color:var(--bad)}
.fb-detail{margin:0;font-size:1rem}
.fb-detail .kana{font-size:1.4rem;font-weight:700}

/* sentence builder */
.s-ko{font-size:1.5rem;font-weight:700;text-align:center;line-height:1.35;margin:0}
.s-ans{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:132px;padding:10px 4px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line) 55px,var(--line) 57px)}
.s-bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tok{font-family:var(--font-kana);font-size:1.5rem;font-weight:500;padding:8px 14px;background:var(--surface);
  border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line)}
.tok:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tok.used{opacity:.25;box-shadow:none}
.s-ans.right .tok{border-color:var(--ok);background:var(--ok-soft)}
.s-ans.wrong .tok{border-color:var(--bad);background:var(--bad-soft)}

/* quit sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:1.15rem}

/* result */
.result{display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center;padding-top:24px}
.score{font-size:4rem;font-weight:700;color:var(--primary);line-height:1}
.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.chip{background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:6px 14px;font-weight:700;font-size:.9rem}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  'use strict';

  /* ---------- data ---------- */
  var ROWS = {
    a: 'あ아 い이 う우 え에 お오', ka: 'か카 き키 く쿠 け케 こ코', sa: 'さ사 し시 す스 せ세 そ소',
    ta: 'た타 ち치 つ츠 て테 と토', na: 'な나 に니 ぬ누 ね네 の노', ha: 'は하 ひ히 ふ후 へ헤 ほ호',
    ma: 'ま마 み미 む무 め메 も모', ya: 'や야 ゆ유 よ요', ra: 'ら라 り리 る루 れ레 ろ로', wa: 'わ와 を오 ん응',
    ga: 'が가 ぎ기 ぐ구 げ게 ご고', za: 'ざ자 じ지 ず즈 ぜ제 ぞ조', da: 'だ다 ぢ지 づ즈 で데 ど도',
    ba: 'ば바 び비 ぶ부 べ베 ぼ보', pa: 'ぱ파 ぴ피 ぷ푸 ぺ페 ぽ포'
  };
  var UNITS = [
    { id: 'u1', name: 'あ행', rows: ['a'] },
    { id: 'u2', name: 'か행', rows: ['ka'] },
    { id: 'u3', name: 'さ행', rows: ['sa'] },
    { id: 'u4', name: 'た행', rows: ['ta'] },
    { id: 'u5', name: 'な행', rows: ['na'] },
    { id: 'u6', name: 'は행', rows: ['ha'] },
    { id: 'u7', name: 'ま행', rows: ['ma'] },
    { id: 'u8', name: 'や·わ행', rows: ['ya', 'wa'] },
    { id: 'u9', name: 'ら행', rows: ['ra'] },
    { id: 'u10', name: '탁음 が·ざ행', rows: ['ga', 'za'] },
    { id: 'u11', name: '탁음 だ·ば행', rows: ['da', 'ba'] },
    { id: 'u12', name: '반탁음 ぱ행', rows: ['pa'] }
  ];
  var TOTAL = 10;
  /* 문장 만들기: 히라가나만 쓴 쉬운 문장. w = 단어 단위 조각 */
  var SENTS = [
    { ko: '저는 학생입니다', w: ['わたし', 'は', 'がくせい', 'です'] },
    { ko: '이것은 책입니다', w: ['これ', 'は', 'ほん', 'です'] },
    { ko: '이것은 사과입니다', w: ['これ', 'は', 'りんご', 'です'] },
    { ko: '이것은 우산입니다', w: ['これ', 'は', 'かさ', 'です'] },
    { ko: '이것은 제 가방입니다', w: ['これ', 'は', 'わたし', 'の', 'かばん', 'です'] },
    { ko: '개는 귀엽습니다', w: ['いぬ', 'は', 'かわいい', 'です'] },
    { ko: '바다는 큽니다', w: ['うみ', 'は', 'おおきい', 'です'] },
    { ko: '하늘은 파랗습니다', w: ['そら', 'は', 'あおい', 'です'] },
    { ko: '꽃이 예쁩니다', w: ['はな', 'が', 'きれい', 'です'] },
    { ko: '고양이가 있습니다', w: ['ねこ', 'が', 'います'] },
    { ko: '저는 밥을 먹습니다', w: ['わたし', 'は', 'ごはん', 'を', 'たべます'] },
    { ko: '저는 물을 마십니다', w: ['わたし', 'は', 'みず', 'を', 'のみます'] },
    { ko: '저는 책을 읽습니다', w: ['わたし', 'は', 'ほん', 'を', 'よみます'] },
    { ko: '저는 음악을 듣습니다', w: ['わたし', 'は', 'おんがく', 'を', 'ききます'] },
    { ko: '저는 노래를 부릅니다', w: ['わたし', 'は', 'うた', 'を', 'うたいます'] },
    { ko: '저는 집에 돌아갑니다', w: ['わたし', 'は', 'うち', 'に', 'かえります'] },
    { ko: '저는 차를 좋아합니다', w: ['わたし', 'は', 'おちゃ', 'が', 'すきです'] },
    { ko: '저는 생선을 좋아합니다', w: ['わたし', 'は', 'さかな', 'が', 'すきです'] },
    { ko: '비가 옵니다', w: ['あめ', 'が', 'ふります'] },
    { ko: '새가 웁니다', w: ['とり', 'が', 'なきます'] },
    { ko: '거기에 산이 있습니다', w: ['そこ', 'に', 'やま', 'が', 'あります'] }
  ];
  var TOTAL_S = 8;

  function conv(s) {
    return s.replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); });
  }
  function rowChars(k) {
    return ROWS[k].split(' ').map(function (s) { return { h: s.charAt(0), k: s.charAt(1) }; });
  }
  function charsOf(u, sc) {
    var out = [];
    u.rows.forEach(function (r) {
      rowChars(r).forEach(function (c) { out.push({ h: c.h, k: c.k, g: sc === 'kata' ? conv(c.h) : c.h }); });
    });
    return out;
  }
  function allChars(sc) {
    var out = [];
    UNITS.forEach(function (u) { out = out.concat(charsOf(u, sc)); });
    return out;
  }
  function unitById(id) { return UNITS.filter(function (u) { return u.id === id; })[0]; }
  function unitName(u, sc) { return sc === 'kata' ? conv(u.name) : u.name; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- saved progress (this browser only) ---------- */
  var KEY = 'kana-practice-v1';
  var save = { xp: 0, streak: 0, last: '', done: {} };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); for (var k in p) save[k] = p[k]; }
  } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function currentStreak() {
    var t = new Date(), y = new Date();
    y.setDate(y.getDate() - 1);
    return (save.last === ymd(t) || save.last === ymd(y)) ? save.streak : 0;
  }
  function doneUnits(sc) {
    return UNITS.filter(function (u) { return save.done[sc + '-' + u.id]; });
  }

  /* ---------- sound (the device's own Japanese voice, no network) ---------- */
  var jaVoice = null;
  var bridge = window.AndroidTTS || null;
  var hasWebTTS = 'speechSynthesis' in window;
  var hasTTS = !!bridge || hasWebTTS;
  function loadVoices() {
    if (!hasWebTTS) return;
    var vs = speechSynthesis.getVoices();
    jaVoice = null;
    for (var i = 0; i < vs.length; i++) { if (/^ja/i.test(vs[i].lang)) { jaVoice = vs[i]; break; } }
  }
  if (hasWebTTS) {
    loadVoices();
    speechSynthesis.onvoiceschanged = function () {
      loadVoices();
      var n = document.getElementById('voice-note');
      if (n) n.textContent = voiceNote();
    };
  }
  function speak(text) {
    if (bridge) { try { bridge.speak(text); } catch (e) {} return; }
    if (!hasWebTTS) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      if (jaVoice) u.voice = jaVoice;
      u.rate = 0.8;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function voiceNote() {
    if (!hasTTS) return '이 브라우저에서는 소리를 낼 수 없어요';
    if (bridge) {
      var ok = false;
      try { ok = bridge.hasJapanese(); } catch (e) {}
      return ok ? '일본어 음성을 찾았어요' : '일본어 음성을 못 찾았어요. 폰 설정의 텍스트 음성 변환에서 일본어를 추가하세요';
    }
    return jaVoice ? '일본어 음성을 찾았어요' : '일본어 음성을 못 찾았어요. 소리가 안 나면 기기 설정에서 일본어 음성을 추가하세요';
  }

  /* ---------- state ---------- */
  var S = { view: 'home', script: 'hira', unit: null, L: null };
  var app = document.getElementById('app');
  var lastView = '';

  var ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var ICON_SPK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  /* ---------- views ---------- */
  function homeView() {
    var sc = S.script;
    var cards = UNITS.map(function (u) {
      var d = save.done[sc + '-' + u.id];
      var cs = charsOf(u, sc);
      return '<button class="unit' + (d ? ' done' : '') + '" data-a="unit" data-id="' + u.id + '">' +
        '<span class="unit-name kana">' + unitName(u, sc) + '</span>' +
        '<span class="unit-sub">' + cs.map(function (c) { return c.g; }).join(' ') + '</span>' +
        '<span class="unit-stat">' + (d ? d.runs + '회 완료 · 최고 ' + d.best + '/' + TOTAL : '아직 안 했어요') + '</span></button>';
    }).join('');
    var hasDone = doneUnits(sc).length > 0;
    var mix = '<button class="unit mix' + (hasDone ? ' done' : '') + '" data-a="mix"' + (hasDone ? '' : ' disabled') + '>' +
      '<span class="unit-name">섞어 풀기</span>' +
      '<span class="unit-sub" style="letter-spacing:0">' + (hasDone ? '배운 글자만 섞어서 복습해요' : '한 단원을 끝내면 열려요') + '</span></button>';
    var sd = save.done.sent;
    var sentCard = '<button class="unit mix' + (sd ? ' done' : '') + '" data-a="sent">' +
      '<span class="unit-name">문장 만들기</span>' +
      '<span class="unit-sub" style="letter-spacing:0">단어를 순서대로 눌러 문장을 만들어요</span>' +
      '<span class="unit-stat">' + (sd ? sd.runs + '회 완료 · 최고 ' + sd.best + '/' + TOTAL_S : '아직 안 했어요') + '</span></button>';
    return '<header class="top"><h1>가나 연습</h1><div class="stats"><span>연속 <b>' + currentStreak() + '</b>일</span><span><b>' + save.xp + '</b> XP</span></div></header>' +
      '<div class="tabs" role="group" aria-label="글자 종류">' +
      '<button class="tab" data-a="tab" data-v="hira" aria-pressed="' + (sc === 'hira') + '">히라가나</button>' +
      '<button class="tab" data-a="tab" data-v="kata" aria-pressed="' + (sc === 'kata') + '">가타카나</button></div>' +
      '<div class="voice"><span id="voice-note">' + voiceNote() + '</span><button class="link" data-a="test">소리 들어보기</button></div>' +
      '<div class="units">' + cards + mix + sentCard + '</div>';
  }

  function unitView() {
    var sc = S.script, u = unitById(S.unit), cs = charsOf(u, sc);
    return '<div class="row"><button class="icon" data-a="home" aria-label="처음으로">' + ICON_BACK + '</button><h2 class="kana">' + unitName(u, sc) + '</h2></div>' +
      '<p class="hint">글자를 누르면 소리가 나요. 한번 들어보고 시작하세요.</p>' +
      '<div class="grid">' + cs.map(function (c) {
        return '<button class="cell" data-a="hear" data-t="' + c.h + '"><span class="kana g">' + c.g + '</span><span class="k">' + c.k + '</span></button>';
      }).join('') + '</div>' +
      '<button class="btn" data-a="start" data-id="' + u.id + '">연습 시작</button>';
  }

  function keyOf(q) {
    return q.type === 'read' ? function (c) { return c.k; } : function (c) { return c.g; };
  }

  function quitSheet(L) {
    return L.quit ? '<div class="backdrop"><div class="sheet" role="dialog" aria-label="그만할까요?"><h3>그만할까요?</h3><p class="hint">지금까지 푼 기록은 저장되지 않아요.</p>' +
      '<button class="btn" data-a="quitNo">계속하기</button><button class="btn ghost" data-a="quitYes">그만하기</button></div></div>' : '';
  }

  function sentView() {
    var L = S.L, q = L.cur, fb = L.phase === 'fb';
    var prompt = q.type === 'listen'
      ? '<button class="speak big" data-a="hear" data-t="' + q.s.w.join('') + '" aria-label="소리 듣기">' + ICON_SPK + '</button>'
      : '<p class="s-ko">' + q.s.ko + '</p>';
    var instr = q.type === 'listen' ? '들은 문장을 단어 순서대로 만드세요' : '일본어로 만들어 보세요';
    var used = {};
    L.ans.forEach(function (id) { used[id] = true; });
    var ans = L.ans.map(function (id) {
      return '<button class="tok" data-a="untok" data-i="' + id + '"' + (fb ? ' disabled' : '') + '>' + q.tokens[id].w + '</button>';
    }).join('');
    var bank = q.tokens.map(function (t) {
      return '<button class="tok' + (used[t.id] ? ' used' : '') + '" data-a="tok" data-i="' + t.id + '"' + (used[t.id] || fb ? ' disabled' : '') + '>' + t.w + '</button>';
    }).join('');
    var full = q.s.w.join('');
    var foot;
    if (!fb) {
      foot = '<div class="l-foot"><button class="btn" data-a="check"' + (L.ans.length ? '' : ' disabled') + '>확인</button></div>';
    } else if (L.ok) {
      foot = '<div class="l-foot ok"><p class="fb-title">맞아요!</p><p class="fb-detail"><span class="kana">' + full + '</span><br>' + q.s.ko + '</p><button class="btn ok" data-a="next">계속</button></div>';
    } else {
      foot = '<div class="l-foot bad"><p class="fb-title">아쉬워요</p><p class="fb-detail">정답은 <span class="kana">' + full + '</span><br>' + q.s.ko + '<br>나중에 다시 나와요.</p><button class="btn bad" data-a="next">계속</button></div>';
    }
    return '<div class="lesson"><div class="l-top"><button class="icon" data-a="quit" aria-label="그만하기">' + ICON_X + '</button>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + L.total + '" aria-valuenow="' + L.done + '"><i style="width:' + (L.done / L.total * 100) + '%"></i></div></div>' +
      '<div class="l-body"><p class="instr">' + instr + '</p><div class="prompt">' + prompt + '</div>' +
      '<div class="s-ans' + (fb ? (L.ok ? ' right' : ' wrong') : '') + '">' + ans + '</div><div class="s-bank">' + bank + '</div></div>' +
      foot + '</div>' + quitSheet(L);
  }

  function lessonView() {
    var L = S.L, q = L.cur, key = keyOf(q);
    var instr, prompt;
    if (q.type === 'listen') {
      instr = '소리를 듣고 알맞은 글자를 고르세요';
      prompt = '<button class="speak big" data-a="hear" data-t="' + q.item.h + '" aria-label="소리 듣기">' + ICON_SPK + '</button>';
    } else if (q.type === 'read') {
      instr = '이 글자는 어떤 소리일까요?';
      prompt = '<span class="prompt-glyph kana">' + q.item.g + '</span><button class="speak small" data-a="hear" data-t="' + q.item.h + '" aria-label="소리 듣기">' + ICON_SPK + '</button>';
    } else {
      instr = '이 소리에 맞는 글자를 고르세요';
      prompt = '<span class="prompt-hangul">' + q.item.k + '</span><button class="speak small" data-a="hear" data-t="' + q.item.h + '" aria-label="소리 듣기">' + ICON_SPK + '</button>';
    }
    var opts = q.opts.map(function (o, i) {
      var cls = 'opt';
      if (L.phase === 'fb') {
        if (key(o) === key(q.item)) cls += ' right';
        else if (i === L.selected) cls += ' wrong';
      } else if (i === L.selected) cls += ' sel';
      return '<button class="' + cls + '" data-a="opt" data-i="' + i + '"' + (L.phase === 'fb' ? ' disabled' : '') + '>' +
        '<span class="num">' + (i + 1) + '</span>' +
        (q.type === 'read' ? '<span class="lab">' + o.k + '</span>' : '<span class="kana lab-g">' + o.g + '</span>') + '</button>';
    }).join('');
    var foot;
    if (L.phase === 'ask') {
      foot = '<div class="l-foot"><button class="btn" data-a="check"' + (L.selected === null ? ' disabled' : '') + '>확인</button></div>';
    } else if (L.ok) {
      foot = '<div class="l-foot ok"><p class="fb-title">맞아요!</p><p class="fb-detail"><span class="kana">' + q.item.g + '</span> · ' + q.item.k + '</p><button class="btn ok" data-a="next">계속</button></div>';
    } else {
      foot = '<div class="l-foot bad"><p class="fb-title">아쉬워요</p><p class="fb-detail">정답은 <span class="kana">' + q.item.g + '</span> · ' + q.item.k + ' 이에요. 나중에 다시 나와요.</p><button class="btn bad" data-a="next">계속</button></div>';
    }
    var quit = quitSheet(L);
    return '<div class="lesson"><div class="l-top"><button class="icon" data-a="quit" aria-label="그만하기">' + ICON_X + '</button>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + L.total + '" aria-valuenow="' + L.done + '"><i style="width:' + (L.done / L.total * 100) + '%"></i></div></div>' +
      '<div class="l-body"><p class="instr">' + instr + '</p><div class="prompt">' + prompt + '</div><div class="opts">' + opts + '</div></div>' +
      foot + '</div>' + quit;
  }

  function resultView() {
    var L = S.L;
    var msg = L.firstOK === L.total ? '하나도 안 틀렸어요!' : (L.firstOK / L.total >= 0.7 ? '잘했어요!' : '틀린 문제는 다시 풀어서 맞혔어요.');
    return '<div class="result"><h2>연습 끝</h2><div class="score">' + L.firstOK + '/' + L.total + '</div><p class="hint">' + msg + '</p>' +
      '<div class="chips"><span class="chip">+' + L.gain + ' XP</span><span class="chip">연속 ' + currentStreak() + '일</span></div>' +
      '<button class="btn" data-a="again">한 번 더</button><button class="btn ghost" data-a="home">처음으로</button></div>';
  }

  function render() {
    var v = S.view;
    app.innerHTML = v === 'home' ? homeView() : v === 'unit' ? unitView() : v === 'lesson' ? (S.L.mode === 'sent' ? sentView() : lessonView()) : resultView();
    if (v !== lastView) { window.scrollTo(0, 0); lastView = v; }
  }

  /* ---------- lesson logic ---------- */
  function buildOpts(q, L) {
    var key = keyOf(q);
    var near = shuffle(L.pool.filter(function (c) { return c.k !== q.item.k; }));
    var rest = shuffle(allChars(L.sc).filter(function (c) {
      return c.k !== q.item.k && !L.pool.some(function (p) { return p.g === c.g; });
    }));
    var used = {};
    used[key(q.item)] = true;
    var out = [];
    near.concat(rest).forEach(function (c) {
      if (out.length < 3 && !used[key(c)]) { used[key(c)] = true; out.push(c); }
    });
    q.opts = shuffle([q.item].concat(out));
  }

  function startLesson(uid) {
    var sc = S.script, pool;
    if (uid === 'mix') {
      pool = [];
      doneUnits(sc).forEach(function (u) { pool = pool.concat(charsOf(u, sc)); });
      if (!pool.length) pool = charsOf(UNITS[0], sc);
    } else {
      pool = charsOf(unitById(uid), sc);
    }
    var items = [];
    while (items.length < TOTAL) {
      var batch = shuffle(pool);
      if (items.length && batch.length > 1 && batch[0].g === items[items.length - 1].g) batch.push(batch.shift());
      items = items.concat(batch);
    }
    items.length = TOTAL;
    var types = ['listen', 'read', 'write'], off = Math.floor(Math.random() * 3);
    var L = { total: TOTAL, uid: uid, sc: sc, pool: pool, queue: [], done: 0, firstOK: 0, selected: null, phase: 'ask', ok: false, quit: false, cur: null, gain: 0 };
    items.forEach(function (it, i) { L.queue.push({ item: it, type: types[(i + off) % 3], first: true }); });
    S.L = L;
    S.view = 'lesson';
    nextQ();
  }

  function startSent() {
    var picks = shuffle(SENTS).slice(0, TOTAL_S);
    var L = { mode: 'sent', uid: 'sent', total: TOTAL_S, queue: [], done: 0, firstOK: 0, ans: [], phase: 'ask', ok: false, quit: false, cur: null, gain: 0 };
    picks.forEach(function (s, i) { L.queue.push({ s: s, type: i % 2 ? 'listen' : 'build', first: true }); });
    L.queue = shuffle(L.queue);
    S.L = L;
    S.view = 'lesson';
    nextS();
  }

  function nextS() {
    var L = S.L, q = L.cur = L.queue.shift();
    var extra = [];
    SENTS.forEach(function (s) {
      s.w.forEach(function (w) { if (q.s.w.indexOf(w) < 0 && extra.indexOf(w) < 0) extra.push(w); });
    });
    q.tokens = shuffle(q.s.w.concat(shuffle(extra).slice(0, 2))).map(function (w, i) { return { w: w, id: i }; });
    L.ans = [];
    L.phase = 'ask';
    render();
    if (q.type === 'listen') speak(q.s.w.join(''));
  }

  function checkSent() {
    var L = S.L, q = L.cur;
    if (!L.ans.length || L.phase !== 'ask') return;
    L.ok = L.ans.map(function (id) { return q.tokens[id].w; }).join('|') === q.s.w.join('|');
    L.phase = 'fb';
    if (L.ok) {
      L.done++;
      if (q.first) L.firstOK++;
    } else {
      L.queue.push({ s: q.s, type: q.type === 'listen' ? 'build' : 'listen', first: false });
    }
    render();
    speak(q.s.w.join(''));
  }

  function nextQ() {
    var L = S.L;
    L.cur = L.queue.shift();
    buildOpts(L.cur, L);
    L.selected = null;
    L.phase = 'ask';
    render();
    if (L.cur.type === 'listen') speak(L.cur.item.h);
  }

  function check() {
    if (S.L.mode === 'sent') { checkSent(); return; }
    var L = S.L, q = L.cur;
    if (L.selected === null || L.phase !== 'ask') return;
    var key = keyOf(q);
    var ok = key(q.opts[L.selected]) === key(q.item);
    L.ok = ok;
    L.phase = 'fb';
    if (ok) {
      L.done++;
      if (q.first) L.firstOK++;
    } else {
      var order = ['listen', 'read', 'write'];
      L.queue.push({ item: q.item, type: order[(order.indexOf(q.type) + 1) % 3], first: false });
    }
    render();
    speak(q.item.h);
  }

  function next() {
    var L = S.L;
    if (L.phase !== 'fb') return;
    if (L.queue.length === 0) finish(); else if (L.mode === 'sent') nextS(); else nextQ();
  }

  function finish() {
    var L = S.L, k = L.mode === 'sent' ? 'sent' : L.sc + '-' + L.uid;
    var d = save.done[k] || { runs: 0, best: 0 };
    d.runs++;
    d.best = Math.max(d.best, L.firstOK);
    save.done[k] = d;
    L.gain = L.firstOK * 10 + (L.firstOK === L.total ? 20 : 0);
    save.xp += L.gain;
    var today = ymd(new Date());
    if (save.last !== today) {
      var y = new Date();
      y.setDate(y.getDate() - 1);
      save.streak = save.last === ymd(y) ? save.streak + 1 : 1;
      save.last = today;
    }
    persist();
    S.view = 'result';
    render();
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-a');
    if (a === 'tab') { S.script = el.getAttribute('data-v'); render(); }
    else if (a === 'unit') { S.unit = el.getAttribute('data-id'); S.view = 'unit'; render(); }
    else if (a === 'mix') { startLesson('mix'); }
    else if (a === 'sent') { startSent(); }
    else if (a === 'tok') { if (S.L.phase === 'ask') { S.L.ans.push(+el.getAttribute('data-i')); render(); } }
    else if (a === 'untok') { if (S.L.phase === 'ask') { var ui = +el.getAttribute('data-i'); S.L.ans = S.L.ans.filter(function (x) { return x !== ui; }); render(); } }
    else if (a === 'start') { startLesson(el.getAttribute('data-id')); }
    else if (a === 'home') { S.view = 'home'; render(); }
    else if (a === 'hear') { speak(el.getAttribute('data-t')); }
    else if (a === 'test') { speak('あ'); }
    else if (a === 'opt') { if (S.L.phase === 'ask') { S.L.selected = +el.getAttribute('data-i'); render(); } }
    else if (a === 'check') { check(); }
    else if (a === 'next') { next(); }
    else if (a === 'quit') { S.L.quit = true; render(); }
    else if (a === 'quitNo') { S.L.quit = false; render(); }
    else if (a === 'quitYes') { S.view = 'home'; S.L = null; render(); }
    else if (a === 'again') { if (S.L.mode === 'sent') startSent(); else startLesson(S.L.uid); }
  });

  document.addEventListener('keydown', function (e) {
    if (S.view !== 'lesson' || !S.L || S.L.quit) return;
    var L = S.L;
    if (L.mode !== 'sent' && e.key >= '1' && e.key <= '4' && L.phase === 'ask') {
      var i = +e.key - 1;
      if (i < L.cur.opts.length) { L.selected = i; render(); }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (L.phase === 'ask') check(); else next();
    }
  });

  render();
  if (bridge) {
    [600, 1500, 3000].forEach(function (ms) {
      setTimeout(function () {
        var n = document.getElementById('voice-note');
        if (n) n.textContent = voiceNote();
      }, ms);
    });
  }
})();
</script>
</body>
</html>
