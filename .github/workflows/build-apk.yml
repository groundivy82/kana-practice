name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug -Pvc=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kana-practice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kana-practice-apk
          path: kana-practice.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest kana-practice.apk \
            --title "가나 연습 (최신 APK)" \
            --notes "폰에서 kana-practice.apk 를 받아 설치하세요." \
            --target "${{ github.sha }}"
